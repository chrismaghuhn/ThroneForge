name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: throneforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.runner_os }})
    runs-on: ${{ matrix.runner_os }}
    strategy:
      fail-fast: false
      matrix:
        runner_os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Show .NET SDK information
        run: dotnet --info

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Run tests
        run: dotnet test -c Release --no-build --logger trx --results-directory "artifacts/test-results/${{ matrix.runner_os }}"

      - name: Verify test result completeness
        shell: pwsh
        run: |
          $resultDirectory = "artifacts/test-results/${{ matrix.runner_os }}"
          $expectedProjects = @(
              Get-ChildItem "tests" -Recurse -Filter "*.csproj" -File | Where-Object {
                  $project = [xml](Get-Content -LiteralPath $_.FullName -Raw)
                  @($project.Project.PropertyGroup.IsTestProject) -contains "true"
              }
          )
          $trxFiles = @(
              Get-ChildItem $resultDirectory -Recurse -Filter "*.trx" -File
          )

          if ($trxFiles.Count -ne $expectedProjects.Count) {
              throw "Expected $($expectedProjects.Count) TRX files, but found $($trxFiles.Count)."
          }

          $totalTests = 0
          $failedTests = 0

          foreach ($trxFile in $trxFiles) {
              [xml]$document = Get-Content -LiteralPath $trxFile.FullName -Raw
              $namespace = New-Object System.Xml.XmlNamespaceManager($document.NameTable)
              $namespace.AddNamespace("trx", $document.DocumentElement.NamespaceURI)

              $counters = $document.SelectSingleNode(
                  "/trx:TestRun/trx:ResultSummary/trx:Counters",
                  $namespace
              )

              if ($null -eq $counters) {
                  throw "TRX file '$($trxFile.Name)' does not contain result counters."
              }

              $fileTotal = [int]$counters.GetAttribute("total")
              $fileFailed = [int]$counters.GetAttribute("failed")
              $fileErrors = [int]$counters.GetAttribute("error")

              if ($fileTotal -lt 1) {
                  throw "TRX file '$($trxFile.Name)' contains no discovered tests."
              }

              $totalTests += $fileTotal
              $failedTests += $fileFailed + $fileErrors
          }

          if ($failedTests -ne 0) {
              throw "TRX verification found $failedTests failed or errored tests."
          }

          Write-Host "Verified $($trxFiles.Count) TRX files containing $totalTests tests."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: throneforge-test-results-${{ matrix.runner_os }}-${{ github.run_id }}
          path: artifacts/test-results/${{ matrix.runner_os }}
          if-no-files-found: warn
          retention-days: 14
